[project]
name = "shipcheck"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents==1.8.12",
    "packaging>=26.3",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcheck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["llm: needs LiveKit Inference credentials (real LLM, mocked HTTP)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]
