<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shipcheck</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232a74ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "livekit-client": "https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.esm.mjs"
        }

    <script type="module" src="/static/app.js"></script>

    <canvas id="blob" aria-hidden="true"></canvas>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button id="toggle" type="button">Start talking to agent</button>
    </main>
  </body>
